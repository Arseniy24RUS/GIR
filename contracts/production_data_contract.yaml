version: 1
release_policy:
  prohibit_generated_country_data: true
  prohibit_seed_scores_in_production: true
  require_raw_snapshot_for_every_value: true
  require_source_url_for_every_value: true
  require_formula_for_every_index: true
  require_ru_primary_labels: true
indices:
  - id: HDI
    ru_label: "ИЧР — Индекс человеческого развития"
    en_label: "Human Development Index"
    production_mode: official_or_recomputed_from_official_components
    required_components: [life_expectancy, expected_years_schooling, mean_years_schooling, gni_per_capita]
  - id: HCI
    ru_label: "Индекс человеческого капитала"
    en_label: "Human Capital Index"
    production_mode: official_or_official_dataset
  - id: GTCI
    ru_label: "Индекс глобальной конкурентоспособности талантов"
    en_label: "Global Talent Competitiveness Index"
    production_mode: official_report_or_official_dataset
  - id: GII
    ru_label: "Глобальный инновационный индекс"
    en_label: "Global Innovation Index"
    production_mode: official_report_or_official_dataset
  - id: IDI
    ru_label: "Индекс развития ИКТ"
    en_label: "ICT Development Index"
    production_mode: official_dataset
  - id: QS_ET
    ru_label: "QS: инженерия и технологии"
    en_label: "QS Engineering & Technology"
    production_mode: official_qs_ranking_derived_country_aggregation
    derived: true
    warning_required: true
  - id: HTEI
    ru_label: "Индекс занятости в высокотехнологичных отраслях"
    en_label: "High-Tech Employment Index"
    production_mode: recomputed_from_real_components
required_value_fields:
  - value_id
  - iso3
  - year
  - index_id
  - component_id
  - value
  - unit
  - source_id
  - source_url
  - retrieved_at
  - raw_snapshot_path
  - raw_snapshot_sha256
  - transformation_run_id
  - formula_version
  - quality_flag
forbidden_terms:
  - placeholder
  - TODO
  - TBD
  - demo
  - sample
  - seed
  - mock
  - fake
  - synthetic
  - generated
  - lorem
  - заглушка
  - демо
  - пример
  - сгенерировано
