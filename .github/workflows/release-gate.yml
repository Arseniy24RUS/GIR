name: release-gate
on:
  pull_request:
  push:
    branches: [ main, release, develop ]
  workflow_dispatch:
    inputs:
      strict_release:
        description: Run the customer-final release gate
        required: false
        default: false
        type: boolean
jobs:
  scientific-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Scientific candidate gate
        run: bash scripts/patch_candidate_gate.sh
      - name: Playwright
        run: |
          bash scripts/playwright_install.sh
          cd playwright && npx playwright test
      - name: Bind Playwright evidence
        run: python scripts/record_playwright_v6_evidence.py
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-v6
          path: |
            playwright/playwright-report/
            audit_evidence/playwright/
            audit_evidence/outputs/playwright-summary.json
  customer-final-release:
    if: github.event_name == 'workflow_dispatch' && inputs.strict_release
    needs: scientific-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip && pip install -r requirements.lock
      - name: Strict customer release gate
        run: bash scripts/release_gate.sh
