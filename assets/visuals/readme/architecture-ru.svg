<svg xmlns="http://www.w3.org/2000/svg" width="800" height="850" viewBox="0 0 800 850" role="img" aria-labelledby="title"><title id="title">GIR / Архитектура публикации</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#287d80"/></marker></defs><rect width="800" height="850" fill="#f7fafb"/><g font-family="Arial, sans-serif" fill="#162e44"><text x="40" y="52" font-size="28" font-weight="700">GIR / Архитектура публикации</text><text x="40" y="88" font-size="19">Смысл показателей и происхождение данных сохраняются.</text><rect x="40" y="124" width="720" height="130" rx="6" fill="#edf0f6" stroke="#aec4d0" stroke-dasharray="6 5"/><text x="64" y="160" font-size="18">ВНЕШНЯЯ СИСТЕМА / НЕ ВХОДИТ В РЕПОЗИТОРИЙ</text><text x="64" y="195" font-size="23" font-weight="700">Источники → согласование → модели</text><text x="64" y="229" font-size="19">Ряды поставщиков, определения индексов и версии</text><path d="M400 255v34" stroke="#287d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="302" width="720" height="114" rx="6" fill="#fff" stroke="#aec4d0" /><text x="64" y="340" font-size="24" font-weight="700">01 / Статический экспорт</text><text x="64" y="375" font-size="20">Интерфейс + методология + выбранные ответы API</text><text x="64" y="402" font-size="18">manifest.json · api/routes.json · файлы ответов</text><path d="M400 417v34" stroke="#287d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="464" width="720" height="112" rx="6" fill="#eaf5f2" stroke="#aec4d0" /><text x="64" y="502" font-size="24" font-weight="700">02 / Runtime в браузере</text><text x="64" y="536" font-size="20">Запрос → локальный ответ → проверка целостности</text><text x="64" y="562" font-size="18">Только чтение · размер в байтах + SHA-256</text><path d="M400 577v34" stroke="#287d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="624" width="720" height="112" rx="6" fill="#fff" stroke="#aec4d0" /><text x="64" y="662" font-size="24" font-weight="700">03 / Двуязычная аналитика</text><text x="64" y="696" font-size="20">Матрица стран · таблица · идентификаторы источников</text><text x="64" y="722" font-size="18">Видны исходные единицы, годы наблюдений и охват</text><text x="40" y="780" font-size="19" font-weight="700">GitHub Actions публикует pages-dist/ напрямую.</text><text x="40" y="815" font-size="18">Работают только снимки из реестра, не живой backend.</text></g></svg>
