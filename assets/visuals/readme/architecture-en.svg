<svg xmlns="http://www.w3.org/2000/svg" width="800" height="850" viewBox="0 0 800 850" role="img" aria-labelledby="title"><title id="title">GIR / Publication architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#287d80"/></marker></defs><rect width="800" height="850" fill="#f7fafb"/><g font-family="Arial, sans-serif" fill="#162e44"><text x="40" y="52" font-size="28" font-weight="700">GIR / Publication architecture</text><text x="40" y="88" font-size="19">Keep source meaning. Publish inspectable evidence.</text><rect x="40" y="124" width="720" height="130" rx="6" fill="#edf0f6" stroke="#aec4d0" stroke-dasharray="6 5"/><text x="64" y="160" font-size="18">UPSTREAM SYSTEM / NOT INCLUDED HERE</text><text x="64" y="195" font-size="23" font-weight="700">Sources → harmonization → research models</text><text x="64" y="229" font-size="19">Provider series, index definitions and release metadata</text><path d="M400 255v34" stroke="#287d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="302" width="720" height="114" rx="6" fill="#fff" stroke="#aec4d0" /><text x="64" y="340" font-size="24" font-weight="700">01 / Static export</text><text x="64" y="375" font-size="20">Frontend + methodology + selected API responses</text><text x="64" y="402" font-size="18">manifest.json · api/routes.json · response files</text><path d="M400 417v34" stroke="#287d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="464" width="720" height="112" rx="6" fill="#eaf5f2" stroke="#aec4d0" /><text x="64" y="502" font-size="24" font-weight="700">02 / Browser runtime</text><text x="64" y="536" font-size="20">Registered request → local response → integrity check</text><text x="64" y="562" font-size="18">Read-only publication · byte size + SHA-256</text><path d="M400 577v34" stroke="#287d80" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="624" width="720" height="112" rx="6" fill="#fff" stroke="#aec4d0" /><text x="64" y="662" font-size="24" font-weight="700">03 / Bilingual analytical views</text><text x="64" y="696" font-size="20">Country matrix · observation table · source identifiers</text><text x="64" y="722" font-size="18">Original units, reference years and coverage stay visible</text><text x="40" y="780" font-size="19" font-weight="700">GitHub Actions publishes pages-dist/ directly.</text><text x="40" y="815" font-size="18">Only registered snapshots work; this is not a live backend.</text></g></svg>
